<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaster math - calculators</title>
<style>
  :root { --accent: #9e7038; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: #faf7f1; color: #2d2924; line-height: 1.55; }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 2rem; margin: 0 0 8px; color: var(--accent); }
  .lede { margin: 0 0 28px; max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  section { background: #fff; border: 1px solid #e6dbc6; border-radius: 8px; padding: 20px 22px; }
  h2 { font-size: 1.15rem; margin: 0 0 6px; }
  .hint { font-size: 0.9rem; color: #7d6540; margin: 0 0 14px; }
  label { display: block; font-size: 0.9rem; margin: 10px 0 3px; }
  input { width: 100%; padding: 8px 10px; font-size: 1rem; border: 1px solid #d3c3a5; border-radius: 5px; font-family: inherit; }
  button { margin-top: 16px; width: 100%; padding: 11px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; font-family: inherit; }
  button:hover { filter: brightness(1.08); }
  .out { margin-top: 14px; font-size: 1rem; min-height: 1.4em; }
  .out.err { color: #a32222; }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; font-size: 0.85rem; color: #b3a184; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Coaster math</h1>
  <p class="lede">The sheet's yield, the sets' cost, and a price that pays for the evening. Exact arithmetic, every borrowed number labeled.</p>
  <div class="grid">
    <section>
      <h2>Yield plan</h2>
      <p class="hint">The sheet becomes coasters.</p>
      <label for="y-w">Sheet width (cm)</label>
      <input id="y-w" type="number" value="60" min="0" step="5">
      <label for="y-h">Sheet height (cm)</label>
      <input id="y-h" type="number" value="90" min="0" step="5">
      <label for="y-d">Coaster diameter (cm)</label>
      <input id="y-d" type="number" value="10" min="0" step="1">
      <button id="y-go">Cut the sheet</button>
      <div class="out" id="y-out"></div>
    </section>
    <section>
      <h2>Set plan</h2>
      <p class="hint">Sets become sheets to buy.</p>
      <label for="s-n">Sets to make</label>
      <input id="s-n" type="number" value="6" min="0" step="1">
      <label for="s-c">Coasters per set</label>
      <input id="s-c" type="number" value="4" min="0" step="1">
      <label for="s-y">Coasters per sheet</label>
      <input id="s-y" type="number" value="54" min="0" step="1">
      <label for="s-p">Sheet price (dollars)</label>
      <input id="s-p" type="number" value="8" min="0" step="1">
      <button id="s-go">Cost the sets</button>
      <div class="out" id="s-out"></div>
    </section>
    <section>
      <h2>Price plan</h2>
      <p class="hint">Break-even and the tag.</p>
      <label for="p-c">Material per set (dollars)</label>
      <input id="p-c" type="number" value="6.2" min="0" step="0.1">
      <label for="p-h">Hours per set</label>
      <input id="p-h" type="number" value="0.5" min="0" step="0.25">
      <label for="p-r">Hourly rate (dollars)</label>
      <input id="p-r" type="number" value="15" min="0" step="1">
      <label for="p-m">Margin (%)</label>
      <input id="p-m" type="number" value="25" min="0" step="5">
      <button id="p-go">Tag the set</button>
      <div class="out" id="p-out"></div>
    </section>
  </div>
</main>
<footer>Built by the app factory. <a href="index.html">About</a> &middot; <a href="https://github.com/iLanis-agent/coastermath">Source</a></footer>
<script src="engine.js"></script>
<script>
function num(id){ return parseFloat(document.getElementById(id).value); }
function show(id, r, render){
  var el = document.getElementById(id);
  if (r.error) { el.textContent = r.error; el.classList.add('err'); }
  else { el.textContent = render(r); el.classList.remove('err'); }
}
document.getElementById('y-go').addEventListener('click', function(){
  var a=[num('y-w'),num('y-h'),num('y-d')];
  show('y-out', CoasterMath.yieldPlan.apply(null,a), function(r){ return CoasterMath.renderYield.apply(null,[r].concat(a)); });
});
document.getElementById('s-go').addEventListener('click', function(){
  var a=[num('s-n'),num('s-c'),num('s-y'),num('s-p')];
  show('s-out', CoasterMath.setPlan.apply(null,a), function(r){ return CoasterMath.renderSet.apply(null,[r].concat(a)); });
});
document.getElementById('p-go').addEventListener('click', function(){
  var a=[num('p-c'),num('p-h'),num('p-r'),num('p-m')];
  show('p-out', CoasterMath.pricePlan.apply(null,a), function(r){ return CoasterMath.renderPrice.apply(null,[r].concat(a)); });
});
</script>
</body>
</html>
